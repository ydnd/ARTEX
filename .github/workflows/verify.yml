name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-test-db
          POSTGRES_DB: artex_security_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://postgres:ci-only-test-db@localhost:5432/artex_security_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests against isolated database
        # Packages share mutable PostgreSQL fixtures; run them serially.
        run: go test -p 1 ./...
  go-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check known reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan Git history
        run: gitleaks git --redact --no-banner .
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm audit --audit-level=low
        working-directory: web
      - run: node --test src/lib/*.test.mjs
        working-directory: web
      - run: npm run build:static
        working-directory: web
